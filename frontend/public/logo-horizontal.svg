<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lpxLeafGrad" x1="48" y1="70" x2="82" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="45%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#84D46B" />
    </linearGradient>
  </defs>

  <!-- ICON MARK (Box + Leaf) -->
  <g transform="translate(6, 0)">
    <!-- Leaf -->
    <path d="M 50 68 C 34 50 40 24 82 16 C 80 38 68 58 50 68 Z" fill="url(#lpxLeafGrad)" />
    <path d="M 50 68 Q 58 42 82 16" stroke="#15803D" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Isometric Box -->
    <path d="M 28 56 L 56 44" stroke="#0F3D2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 28 56 L 56 70 L 56 100 L 28 86 Z" stroke="#0F3D2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF" />
    <path d="M 56 70 L 84 56 L 84 86 L 56 100 Z" fill="#0F3D2E" stroke="#0F3D2E" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- WORDMARK TYPOGRAPHY -->
  <g transform="translate(108, 0)">
    <!-- LoopPack -->
    <text x="0" y="62" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0F3D2E">Loop</tspan>
      <tspan fill="#22C55E">Pack</tspan>
    </text>

    <!-- EXCHANGE -->
    <text x="4" y="86" font-family="'Inter', system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#0F3D2E" letter-spacing="7.5">
      EXCHANGE
    </text>
  </g>
</svg>
